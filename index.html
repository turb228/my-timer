<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таймер 12х20</title>
    
    <!-- КРИТИЧЕСКИЕ НАСТРОЙКИ ДЛЯ APPLE, ЧТОБЫ СКРЫТЬ БРАУЗЕР И СДЕЛАТЬ ПРИЛОЖЕНИЕ ВНУТРЕННИМ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Таймер 12х20">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .timer {
            font-size: 130px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 5px 0;
            color: #38bdf8;
        }
        .rounds {
            font-size: 26px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        button {
            font-size: 30px;
            font-weight: bold;
            padding: 22px 65px;
            border: none;
            border-radius: 50px;
            background-color: #10b981;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
        }
        button.stop {
            background-color: #ef4444;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="rounds" id="roundsDisplay">Подход: 0 / 12</div>
    <div class="timer" id="timerDisplay">20</div>
    <button id="actionBtn" onclick="toggleTimer()">СТАРТ</button>
</div>

<script>
    let timeLeft = 20;
    let currentRound = 0;
    const totalRounds = 12;
    let timerInterval = null;
    
    const timerDisplay = document.getElementById('timerDisplay');
    const roundsDisplay = document.getElementById('roundsDisplay');
    const actionBtn = document.getElementById('actionBtn');

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3); 
        } catch (e) {
            console.log("Ошибка звука");
        }
    }

    function toggleTimer() {
        if (timerInterval) {
            stopTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (currentRound === 0 || currentRound >= totalRounds) {
            currentRound = 1;
            timeLeft = 20;
        }
        
        actionBtn.innerText = "СТОП";
        actionBtn.classList.add('stop');
        updateDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            
            if (timeLeft <= 0) {
                playBeep();
                
                if (currentRound < totalRounds) {
                    currentRound++;
                    timeLeft = 20;
                } else {
                    stopTimer();
                    currentRound = 0;
                    timeLeft = 20;
                    roundsDisplay.innerText = "Готово! Зубы чистые ✨";
                    timerDisplay.innerText = "🏁";
                    return;
                }
            }
            updateDisplay();
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        actionBtn.innerText = "СТАРТ";
        actionBtn.classList.remove('stop');
    }

    function updateDisplay() {
        timerDisplay.innerText = timeLeft;
        roundsDisplay.innerText = `Подход: ${currentRound} / ${totalRounds}`;
    }
</script>

</body>
</html>
